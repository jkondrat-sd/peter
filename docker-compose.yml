version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-node
    ports:
      - "6379:6379"

  producer:
    build: .
    container_name: producer-node
    volumes:
      - .:/app
    command: ["/bin/sh", "-c", "go mod tidy && go run cmd/producer/main.go"]
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  consumer:
    build: .
    container_name: consumer-node-1
    volumes:
      - .:/app
    command: ["/bin/sh", "-c", "go mod tidy && go run cmd/consumer/main.go"]
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONSUMER_NAME=consumer-node-1

  consumer-2:
    build: .
    container_name: consumer-node-2
    volumes:
      - .:/app
    command: ["/bin/sh", "-c", "go mod tidy && go run cmd/consumer/main.go"]
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONSUMER_NAME=consumer-node-2
