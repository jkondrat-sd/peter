version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-node
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 1gb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data

  mysql-master:
    image: bitnami/mariadb:latest
    container_name: mysql-master
    environment:
      - MARIADB_REPLICATION_MODE=master
      - MARIADB_REPLICATION_USER=repl_user
      - MARIADB_REPLICATION_PASSWORD=repl_pass
      - MARIADB_ROOT_PASSWORD=root_pass
      - MARIADB_DATABASE=audit_log
    ports:
      - "3306:3306"

  mysql-slave:
    image: bitnami/mariadb:latest
    container_name: mysql-slave
    depends_on:
      - mysql-master
    environment:
      - MARIADB_REPLICATION_MODE=slave
      - MARIADB_REPLICATION_USER=repl_user
      - MARIADB_REPLICATION_PASSWORD=repl_pass
      - MARIADB_MASTER_HOST=mysql-master
      - MARIADB_MASTER_PORT_NUMBER=3306
      - MARIADB_MASTER_ROOT_PASSWORD=root_pass
    ports:
      - "3307:3306"

  producer:
    build: .
    container_name: producer-node
    volumes:
      - .:/app
    command: ["/bin/sh", "-c", "go mod tidy && go run cmd/producer/main.go"]
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  consumer:
    build: .
    container_name: consumer-node-1
    volumes:
      - .:/app
    command: ["/bin/sh", "-c", "go mod tidy && go run cmd/consumer/main.go"]
    depends_on:
      - redis
      - mysql-master
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONSUMER_NAME=consumer-node-1
      - MYSQL_MASTER_DSN=root:root_pass@tcp(mysql-master:3306)/audit_log
      - MYSQL_SLAVE_DSN=root:root_pass@tcp(mysql-slave:3306)/audit_log

  consumer-2:
    build: .
    container_name: consumer-node-2
    volumes:
      - .:/app
    command: ["/bin/sh", "-c", "go mod tidy && go run cmd/consumer/main.go"]
    depends_on:
      - redis
      - mysql-master
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONSUMER_NAME=consumer-node-2
      - MYSQL_MASTER_DSN=root:root_pass@tcp(mysql-master:3306)/audit_log
      - MYSQL_SLAVE_DSN=root:root_pass@tcp(mysql-slave:3306)/audit_log

volumes:
  redis_data:
